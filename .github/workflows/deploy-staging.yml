name: Deploy Staging to Shared Hosting via FTP

on:
  push:
    branches:
      - staging

jobs:
  web-deploy:
    name: 🎉 Deploying Staging Code via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync files using lftp
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -f "
          open ftp://${{ secrets.FTP_SERVER }}
          user ${{ secrets.FTP_USERNAME }} ${{ secrets.FTP_PASSWORD }}
          mirror --reverse --delete --exclude .git/ ./ /public_html/staging/
          bye
          "